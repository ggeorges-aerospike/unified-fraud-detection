services:
  aerospike-db:
    image: aerospike/aerospike-server-enterprise:8.0.0.7
    container_name: aerospike-db
    # Mounted OUTSIDE /etc/aerospike on purpose: the image entrypoint renders
    # /etc/aerospike/aerospike.template.conf over /etc/aerospike/aerospike.conf on
    # every fresh container, so a file bind-mounted at that path is silently
    # overwritten (host side too) before asd starts — i.e. it was never applied.
    # Mounting elsewhere read-only and pointing asd at it makes this file
    # authoritative, which is what gives us the `lmcache` namespace.
    volumes:
      - ./config/aerospike.conf:/opt/aerospike/etc/aerospike.conf:ro
    command: ["--config-file", "/opt/aerospike/etc/aerospike.conf"]
    healthcheck:
      test: ["CMD", "asinfo", "-p", "3000", "-v", "build"]
      interval: 5s
      timeout: 20s
      retries: 4
    networks:
      - asgraph_net
    ports:
      - "3000-3002:3000-3002"
  aerospike-graph-service:
    image: aerospike/aerospike-graph-service:3.0.0
    container_name: asgraph-service
    depends_on:
      aerospike-db:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    volumes:
      - ./data:/data
    environment:
      - aerospike.client.namespace=test
      - aerospike.client.host=aerospike-db
      - aerospike.graph.index.vertex.label.enabled=true
      - aerospike.graph.query-tracing.threshold-ms=5
      - aerospike.graph.query-tracing.opentelemetry-host=zipkin
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 4
    networks:
      - asgraph_net
    ports:
      - "8182:8182"
      - "9090:9090"
  zipkin:
    image: openzipkin/zipkin
    container_name: asgraph-zipkin
    networks:
      - asgraph_net
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9411/health"]
      interval: 5s
      timeout: 10s
      retries: 4
  # vLLM on ROCm with LMCache in front and Aerospike as LMCache's remote KV tier.
  # Requires an AMD Instinct host and an image that has the Aerospike connector
  # compiled/installed — stock vLLM and LMCache images do not. Build it first:
  #   docker build -f vllm.Dockerfile -t lmcache-aerospike/vllm-openai:rocm .
  # Then run only this profile:
  #   docker compose --profile vllm up vllm
  # Full runbook: docs/lmcache-aerospike.md
  vllm:
    profiles: ["vllm"]
    image: ${VLLM_IMAGE:-lmcache-aerospike/vllm-openai:rocm}
    container_name: asgraph-vllm
    depends_on:
      aerospike-db:
        condition: service_healthy
    # ROCm device access (AMD's own vLLM tutorials use exactly these).
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp:unconfined
    group_add:
      - video
    ipc: host
    shm_size: 16gb
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - LMCACHE_CONFIG_FILE=/etc/lmcache/lmcache.yaml
      # Env overrides read by the Aerospike connector itself.
      - LMCACHE_AEROSPIKE_HOSTS=${LMCACHE_AEROSPIKE_HOSTS:-aerospike-db:3000}
      - LMCACHE_AEROSPIKE_NAMESPACE=${LMCACHE_AEROSPIKE_NAMESPACE:-lmcache}
      - LMCACHE_AEROSPIKE_SET=${LMCACHE_AEROSPIKE_SET:-kv_chunks}
      - LMCACHE_AEROSPIKE_USERNAME=${LMCACHE_AEROSPIKE_USERNAME:-}
      - LMCACHE_AEROSPIKE_PASSWORD=${LMCACHE_AEROSPIKE_PASSWORD:-}
    volumes:
      - ./config/lmcache.yaml:/etc/lmcache/lmcache.yaml:ro
      - ${HF_CACHE_DIR:-./data/hf-cache}:/root/.cache/huggingface
    command:
      - '--model=${VLLM_MODEL:-Qwen/Qwen3-8B}'
      - '--served-model-name=${VLLM_MODEL:-Qwen/Qwen3-8B}'
      - '--port=8000'
      - '--max-model-len=${VLLM_MAX_MODEL_LEN:-32768}'
      - '--kv-transfer-config={"kv_connector":"LMCacheConnectorV1","kv_role":"kv_both"}'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks:
      - asgraph_net
    ports:
      - "8000:8000"
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: "asgraph-backend"
    depends_on:
      aerospike-db:
        condition: service_healthy
      aerospike-graph-service:
        condition: service_healthy
    environment:
      - AEROSPIKE_HOST=aerospike-db
      - AEROSPIKE_KV_PORT=3000
      # Google ADK / Gemini settings
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      - INVESTIGATION_ENGINE=${INVESTIGATION_ENGINE:-adk}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - ADK_MODEL=${ADK_MODEL:-gemini-3.1-flash-lite}
      # Backup models tried when ADK_MODEL keeps returning 429/5xx after retries
      - ADK_FALLBACK_MODELS=${ADK_FALLBACK_MODELS:-gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      # Tier-2 decision-model triage: mock | decider (Strands Decider) | kev | jev (TypeSafe) | off.
      # Self-hosted servers default to host.docker.internal (:8000 decider, :8009 kev).
      - DECISION_MODEL=${DECISION_MODEL:-mock}
      - DECISION_MODEL_URL=${DECISION_MODEL_URL:-}
      - DECISION_MODEL_NAME=${DECISION_MODEL_NAME:-}
      - DECISION_MODEL_API_KEY=${DECISION_MODEL_API_KEY:-}
      - DECISION_MODEL_TIMEOUT_S=${DECISION_MODEL_TIMEOUT_S:-30}
      - DECISION_MODEL_CONCURRENCY=${DECISION_MODEL_CONCURRENCY:-16}
      - DECISION_MODEL_MOCK_LATENCY_MS=${DECISION_MODEL_MOCK_LATENCY_MS:-70-250}
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY:-}
      - LLM_RETRY_ATTEMPTS=${LLM_RETRY_ATTEMPTS:-5}
      # Run the three evidence specialists concurrently (ADK ParallelAgent)
      - ADK_PARALLEL_EVIDENCE=${ADK_PARALLEL_EVIDENCE:-true}
      # Optional: host Ollama when LLM_PROVIDER=ollama (not part of compose)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      # Optional: vLLM when LLM_PROVIDER=vllm (compose profile `vllm`, or a host/remote server)
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000/v1}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-8B}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      # ReAct prompt block order: current (default) | stable_first
      - PROMPT_LAYOUT=${PROMPT_LAYOUT:-current}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:4000/health"]
      interval: 5s
      timeout: 10s
      retries: 4
    networks:
      - asgraph_net
    ports:
      - "4000:4000"
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: "asgraph-frontend"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BACKEND_URL=http://asgraph-backend:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      # Optional login gate — set both to require sign-in; leave both unset to disable.
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
    networks:
      - asgraph_net
    ports:
      - "8081:8080"
  generator:
    build:
      context: .
      dockerfile: generator.Dockerfile
    container_name: "asgraph-generator"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - asgraph_net
    ports:
      - "4001:4001"
  # Monitoring Stack
  aerospike-exporter:
    image: aerospike/aerospike-prometheus-exporter:latest
    container_name: aerospike-exporter
    depends_on:
      aerospike-db:
        condition: service_healthy
    environment:
      - AS_HOST=aerospike-db
      - AS_PORT=3000
    networks:
      - asgraph_net
    ports:
      - "9145:9145"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - aerospike-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - asgraph_net
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards/custom
      - ./monitoring/dashboards:/var/lib/grafana/dashboards/aerospike
    networks:
      - asgraph_net
    ports:
      - "3030:3000"

networks:
  asgraph_net:
    name: asgraph_net

volumes:
  prometheus_data:
  grafana_data:
