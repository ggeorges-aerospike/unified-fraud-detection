
# Aerospike database configuration file
# This template sets up a single-node, single namespace developer environment.
#
# Alternatively, you can pass in your own configuration file.
# You can see more examples at
# https://github.com/aerospike/aerospike-server/tree/master/as/etc

# This stanza must come first.
service {
	feature-key-file /etc/aerospike/features.conf
	cluster-name docker
}

logging {
	
	
	
	

	# Send log messages to stdout
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000

		# Uncomment the following to set the 'access-address' parameter to the
		# IP address of the Docker host. This will the allow the server to correctly
		# publish the address which applications and other nodes in the cluster to
		# use when addressing this node.
		# access-address <IPADDR>
	}

	heartbeat {
		# mesh is used for environments that do not support multicast
		mode mesh
		address local
		port 3002
		interval 150
		timeout 10
	}

	fabric {
		# Intra-cluster communication port (migrates, replication, etc)
		# default to same address in 'service'
		address local
		port 3001
	}

}

namespace test {
	replication-factor 1
	default-ttl 0
	nsup-period 120

	storage-engine device {
		# For 'storage-engine memory' with 'device' or 'file' backing, we
		# recommend having multiple devices (eight is recommended). One is used
		# here for backward compatibility.
		file /opt/aerospike/data/test.dat
		filesize 4G
		read-page-cache true
	}
}

# KV-cache tier for LMCache (see docs/lmcache-aerospike.md).
# Separate namespace from `test` on purpose: the storage profiles are opposite —
# multi-MB KV chunks churning on TTL versus small fraud records that never expire —
# and co-locating them makes them fight over defrag and device bandwidth.
namespace lmcache {
	replication-factor 1

	# TTL-driven cache. nsup-period MUST be > 0 or nothing is ever reaped: the
	# namespace fills, stop-writes trips, and it looks like an Aerospike capacity
	# fault rather than a config error. default-ttl is only the backstop — the
	# connector sets a per-record TTL on write (default 86400 s).
	default-ttl 3600
	nsup-period 60

	storage-engine device {
		file /opt/aerospike/data/lmcache.dat
		# 4G is enough to exercise the path locally. On the POC host put this on
		# the scratch NVMe and raise it — and remember defrag-lwm-pct 50 means
		# planning to fill no more than ~half of it.
		filesize 4G
		read-page-cache true
	}
}
